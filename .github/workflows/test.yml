name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pytest (mocked, no live APIs)
        env:
          OPENAI_API_KEY: dummy-key-for-tests
        run: python -m pytest

      - name: Run offline eval harness
        env:
          OPENAI_API_KEY: dummy-key-for-tests
        run: python main.py eval-synthesis

  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests in Docker test profile
        run: docker compose --profile test run --rm test
