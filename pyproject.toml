[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-paper-analyzer"
version = "0.2.0"
description = "Terminal research assistant: scholarly search, PDF analysis, reading lists, citations, and layered guardrails (LangChain + OpenAI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["langchain", "openai", "research", "arxiv", "agent", "guardrails"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
